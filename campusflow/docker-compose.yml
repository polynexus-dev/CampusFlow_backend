services:
  web:
    build: .
    ports:
      - "8200:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - pgbouncer
      - redis
      - ollama
    command: /bin/bash ./entrypoint.sh

  db:
    image: postgres:17
    env_file:
      - .env
    # Slow-query visibility: log any statement taking >200ms so we can see
    # what's actually slow instead of guessing. Cheap, no extra service needed.
    command: postgres -c log_min_duration_statement=200
    volumes:
      - CampusFlow_postgres_data:/var/lib/postgresql/data

  # Connection pooler sitting between Django and Postgres. django-tenants
  # switches schemas per-request via `SET search_path`, which only stays
  # correct under PgBouncer's SESSION pooling mode — transaction-mode
  # pooling can hand a connection (with another tenant's search_path still
  # set) to a different tenant's request between transactions, which would
  # leak data across colleges. Do NOT change POOL_MODE to "transaction"
  # without also solving that problem (e.g. per-query SET via psycopg
  # options), since this product stores biometric/DPDP-sensitive data.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=session
      - MAX_CLIENT_CONN=500
      - DEFAULT_POOL_SIZE=25
    ports:
      - "6432:5432"
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - CampusFlow_redis_data:/data

  # Runs the CPU-bound half of the face-attendance pipeline (see
  # campusflow_app/tasks.py) off the web workers, so an attendance-rush
  # burst queues here instead of blocking uvicorn. Doesn't touch Postgres,
  # so it only depends on Redis (broker/result backend) — DB_HOST is still
  # set for consistency in case any Django startup code path expects it.
  celery_worker:
    build: .
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=pgbouncer
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - redis
      - ollama
    command: /bin/bash ./entrypoint_celery.sh

  # Local, on-prem model server for every AI-assisted feature (answer-sheet
  # valuation, accreditation narrative drafting, question generation, student
  # insight — see campusflow_app/ai_*.py). Runs entirely inside this compose
  # network; nothing about any request ever reaches a third-party AI service.
  # entrypoint_ollama.sh pulls AI_GRADING_MODEL/AI_NARRATIVE_MODEL on boot —
  # a no-op once already pulled, so this is safe on every restart. Pulling a
  # multi-GB model can take a while on first boot; web/celery_worker start
  # regardless (every AI feature degrades gracefully with a clear warning if
  # Ollama isn't ready yet, rather than blocking the rest of the app on it).
  ollama:
    image: ollama/ollama:latest
    env_file:
      - .env
    volumes:
      - CampusFlow_ollama_data:/root/.ollama
      - ./entrypoint_ollama.sh:/entrypoint_ollama.sh
    entrypoint: ["/bin/sh", "/entrypoint_ollama.sh"]
    expose:
      - "11434"

volumes:
  CampusFlow_postgres_data:
  CampusFlow_redis_data:
  CampusFlow_ollama_data:

